name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Permite re-publicar desde la pestana Actions sin un push vacio.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub solo deja correr un deploy a la vez por rama.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Publica el artefacto en el entorno de Pages y expone:
      #   base_path -> /demo-arnedolr
      #   origin    -> https://0nisolutions.github.io/demo-arnedolr
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # VITE_BASE y VITE_SITE_ORIGIN: el build tiene que saber donde se publica.
      # El fallback de vite.config.ts ya lee GITHUB_REPOSITORY, pero se pasan
      # explicitos para no depender de esa indireccion.
      - name: Build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: npm run build

      # GitHub Pages no hace rewrite de rutas. Sin esto, abrir
      # /propiedad/casa-el-tipal en frio da 404 y la SPA ni arranca.
      - name: Verificar el fallback de SPA
        run: |
          test -f dist/404.html || { echo "::error::falta dist/404.html"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::falta dist/.nojekyll"; exit 1; }
          grep -q "<div id=\"root\">" dist/404.html || { echo "::error::404.html no parece el index"; exit 1; }
          echo "OK: 404.html y .nojekyll presentes"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Corre los tests de humo contra el build real. Tarda mas (baja Chromium),
  # pero es lo que atrapa el caso "se publico y quedo en blanco".
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Sin VITE_BASE explicito: vite.config.ts deduce /<repo>/ de
      # GITHUB_REPOSITORY, que Actions ya expone.
      - name: Build
        run: npm run build

      # Servidor, espera y tests en un mismo step: cada step corre en un shell
      # nuevo, asi que un "&" de un step previo no se conserva.
      - name: Levantar el build y correr los checks
        run: |
          npx vite preview --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx wait-on http://localhost:4173 --timeout 60000
          npm run check
          npm run smoke

  deploy:
    needs: [build, qa]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
